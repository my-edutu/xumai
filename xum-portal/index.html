<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Allow blob: workers required by Clerk -->
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' * 'unsafe-inline' 'unsafe-eval' blob:; worker-src 'self' blob:;" />
  <title>XUM AI | Global Intelligence Platform</title>
  <meta name="description" content="XUM AI turns real people into AI trainers. We deliver data creation, labeling, and RLHF at global scale." />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries,typography"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#f97316",
            accent: "#3b82f6",
            "surface-dark": "#1e293b",
            "bg-dark": "#020617",
          },
          fontFamily: {
            outfit: ["Outfit", "sans-serif"],
            inter: ["Inter", "sans-serif"],
            heading: ["Space Grotesk", "sans-serif"],
          },
          fontSize: {
            'hero-mobile': ['48px', { lineHeight: '1.1', fontWeight: '700' }],
            'hero-desktop': ['64px', { lineHeight: '1.05', fontWeight: '700' }],
            'section-mobile': ['30px', { lineHeight: '1.2', fontWeight: '600' }],
            'section-desktop': ['36px', { lineHeight: '1.2', fontWeight: '600' }],
            'subheading-mobile': ['18px', { lineHeight: '1.4', fontWeight: '500' }],
            'subheading-desktop': ['20px', { lineHeight: '1.4', fontWeight: '500' }],
            'body-base': ['16px', { lineHeight: '1.6', fontWeight: '400' }],
            'small-base': ['14px', { lineHeight: '1.5', fontWeight: '400' }],
          },
          animation: {
            aurora: "aurora 60s linear infinite",
          },
          keyframes: {
            aurora: {
              from: {
                backgroundPosition: "50% 50%, 50% 50%",
              },
              to: {
                backgroundPosition: "350% 50%, 350% 50%",
              },
            },
          },
        },
      },
      plugins: [
        function addVariablesForColors({ addBase, theme }) {
          const colors = theme("colors");
          const newVars = {};
          
          Object.entries(colors).forEach(([key, val]) => {
            if (typeof val === "string") {
              newVars[`--${key}`] = val;
            } else if (typeof val === "object") {
              Object.entries(val).forEach(([subKey, subVal]) => {
                newVars[`--${key}-${subKey}`] = subVal;
              });
            }
          });

          addBase({
            ":root": newVars,
          });
        }
      ],
    };
  </script>
</head>

<body class="selection:bg-blue-500/30 overflow-x-hidden">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
