<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <!-- viewport-fit=cover enables env(safe-area-inset-*) on notched devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, shrink-to-fit=no" />
  <title>XUM AI</title>
  <meta name="description" content="Earn by training AI — voice, image, video and text tasks. Real rewards for real human data." />

  <!-- PWA / installed-app experience -->
  <meta name="theme-color" content="#101522" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="XUM AI" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/icon.png" />

  <!-- Social sharing -->
  <meta property="og:title" content="XUM AI" />
  <meta property="og:description" content="Earn by training AI — contribute voice, image, video and text data." />
  <meta property="og:image" content="/logo.png" />
  <meta property="og:type" content="website" />

  <!-- Typography: same Inter family the native app uses -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- react-native-web root reset -->
  <style id="expo-reset">
    html,
    body {
      height: 100%;
    }

    body {
      overflow: hidden;
      margin: 0;
      background-color: #101522;
    }

    #root {
      display: flex;
      height: 100%;
      flex: 1;
    }
  </style>

  <!-- Branded splash: shown instantly while the JS bundle loads, removed on mount -->
  <style id="xum-splash-style">
    #xum-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: radial-gradient(900px 600px at 50% 30%, #16203a 0%, #101522 55%, #0b0f1a 100%);
      transition: opacity 320ms ease;
    }

    #xum-splash.xum-splash-hide {
      opacity: 0;
      pointer-events: none;
    }

    #xum-splash img {
      width: 88px;
      height: 88px;
      border-radius: 24px;
      animation: xum-breathe 2.2s ease-in-out infinite;
    }

    #xum-splash .xum-wordmark {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -0.02em;
      color: #fff;
    }

    #xum-splash .xum-wordmark span {
      color: #1349ec;
    }

    #xum-splash .xum-bar {
      width: 132px;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    #xum-splash .xum-bar::after {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background: #1349ec;
      animation: xum-slide 1.1s ease-in-out infinite;
    }

    @keyframes xum-breathe {

      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.06);
        opacity: 0.85;
      }
    }

    @keyframes xum-slide {
      0% {
        transform: translateX(-120%);
      }

      100% {
        transform: translateX(360%);
      }
    }

    @media (prefers-reduced-motion: reduce) {

      #xum-splash img,
      #xum-splash .xum-bar::after {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <noscript>
    You need to enable JavaScript to run this app.
  </noscript>

  <div id="xum-splash" role="status" aria-label="Loading XUM AI">
    <img src="/logo.png" alt="" />
    <div class="xum-wordmark">XUM <span>AI</span></div>
    <div class="xum-bar"></div>
  </div>

  <!-- The root element for your Expo app. -->
  <div id="root"></div>

  <script>
    // Remove the splash as soon as the app mounts into #root.
    (function () {
      var root = document.getElementById('root');
      var splash = document.getElementById('xum-splash');
      if (!root || !splash) return;
      var done = function () {
        splash.classList.add('xum-splash-hide');
        setTimeout(function () { splash.remove(); }, 400);
      };
      if (root.childElementCount > 0) { done(); return; }
      var observer = new MutationObserver(function () {
        if (root.childElementCount > 0) {
          observer.disconnect();
          done();
        }
      });
      observer.observe(root, { childList: true });
      // Safety net: never trap the user on the splash.
      setTimeout(done, 20000);
    })();
  </script>
</body>

</html>
